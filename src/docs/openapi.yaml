openapi: 3.1.0
info:
  title: Deepfake Detection API
  version: 2.0.0
  description: |
    API para detección de deepfakes en imágenes y videos usando **ZeroTrue AI**.

    ## Flujo de uso

    1. **Solicitar URL de subida** → `POST /upload/upload-url`
    2. **Subir archivo a S3** → desde el frontend usando la URL presignada
    3. **Iniciar análisis** → `POST /analysis/start` (devuelve resultado completo)
    4. **Consultar historial** → `GET /historial` (opcional)

    ## Tipos de archivo soportados

    - **Imágenes:** PNG, JPG, JPEG (máx 50MB)
    - **Videos:** MP4, MOV, WEBM (máx 500MB)

    > Los umbrales de video son más estrictos (HIGH desde 0.60).

  contact:
    name: API Support
    email: support@tudominio.com
  license:
    name: MIT

servers:
  - url: https://backend-0ecl.onrender.com
    description: Producción
  - url: http://localhost:4000
    description: Desarrollo Local

tags:
  - name: Files
    description: Gestión de archivos y subida a S3
  - name: Analysis
    description: Análisis de deepfake con ZeroTrue + TrustAnalysisEngine v4
  - name: Auth
    description: Autenticación y gestión de usuarios
  - name: Historial
    description: Historial de análisis del usuario

paths:

  #####################################
  ## POST /upload/upload-url
  #####################################
  /upload/upload-url:
    post:
      tags:
        - Files
      summary: Generar URL presignada para subir archivo a S3
      description: |
        Genera credenciales temporales para subir un archivo directamente a S3
        desde el frontend, sin pasar por el servidor backend.

        **Seguridad:**
        - URL válida por 1 hora
        - Tamaño máximo configurado: 5GB
        - Solo archivos de imagen o video

        **Siguiente paso:**
        Usar `uploadUrl` y `fields` para hacer un `POST multipart/form-data`
        desde el frontend directamente a S3.

      operationId: generateUploadUrl
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileName
                - fileType
              properties:
                fileName:
                  type: string
                  description: Nombre original del archivo
                  example: "video-sospechoso.mp4"
                  minLength: 1
                  maxLength: 255
                fileType:
                  type: string
                  description: MIME type del archivo
                  example: "video/mp4"
                  enum:
                    - image/jpeg
                    - image/jpg
                    - image/png
                    - video/mp4
                    - video/quicktime
                    - video/webm
            examples:
              video:
                value:
                  fileName: "video-prueba.mp4"
                  fileType: "video/mp4"
              image:
                value:
                  fileName: "foto-perfil.jpg"
                  fileType: "image/jpeg"
      responses:
        "200":
          description: URL presignada generada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
              examples:
                success:
                  value:
                    uploadUrl: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/"
                    fields:
                      bucket: "deepfake-detector-files"
                      key: "1763532656440_video-prueba.mp4"
                      X-Amz-Algorithm: "AWS4-HMAC-SHA256"
                      X-Amz-Credential: "AKIAVZXYWLVGWQ5UBY5C/20260518/us-east-1/s3/aws4_request"
                      X-Amz-Date: "20260518T005558Z"
                      Policy: "eyJleHBpcmF0aW9uIjoi..."
                      X-Amz-Signature: "d1e5219137f9969c..."
                    fileUrl: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/1763532656440_video-prueba.mp4"
        "400":
          description: Parámetros inválidos o faltantes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingParams:
                  value:
                    success: false
                    error: "fileName y fileType son requeridos"
                invalidType:
                  value:
                    success: false
                    error: "Tipo de archivo no soportado. Use imagen (png, jpg) o video (mp4, webm)"
        "401":
          description: Token JWT requerido o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## POST /analysis/start
  #####################################
  /analysis/start:
    post:
      tags:
        - Analysis
      summary: Iniciar análisis de deepfake (resultado inmediato)
      description: |
        Inicia y completa el análisis de un archivo subido a S3.

        **Comportamiento v2 (ZeroTrue):**
        - El backend descarga el archivo de S3
        - Lo envía a ZeroTrue y hace polling interno hasta que el análisis esté listo
        - Devuelve el resultado **completo en una sola respuesta** (no necesitas hacer polling)

        **El resultado incluye:**
        - `verdict`: FAKE | REAL
        - `riskLevel`: LOW | MEDIUM | SUSPICIOUS | HIGH | CRITICAL
        - `interpretedLabel`: texto interpretable para mostrar al usuario
        - `explanation`: explicación en lenguaje natural
        - `recommendations`: lista de recomendaciones
        - `trustScore`: puntaje de confianza (0–100, donde 100 = completamente auténtico)
        - `manipulationIndex`: índice de manipulación en % (0–100)
        - `isSuspicious`: true si el score cae en la zona gris (0.45–0.65)
        - `hasFace`: true si se detectó un rostro humano

        **Caché automático:**
        Si el mismo archivo fue analizado antes (mismo hash), devuelve el resultado
        cacheado instantáneamente con `fromCache: true`.

      operationId: startAnalysis
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileUrl
              properties:
                fileUrl:
                  type: string
                  format: uri
                  description: URL completa del archivo en S3 (obtenida de /upload/upload-url)
                  example: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/1763532656440_video.mp4"
                fileName:
                  type: string
                  description: Nombre original del archivo (opcional, para historial)
                  example: "video-sospechoso.mp4"
            examples:
              image:
                value:
                  fileUrl: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/1779065758191_foto.jpg"
                  fileName: "foto.jpg"
              video:
                value:
                  fileUrl: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/1763532656440_video.mp4"
                  fileName: "video-sospechoso.mp4"
      responses:
        "200":
          description: Análisis completado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisCompleteResponse"
              examples:
                deepfakeDetectado:
                  summary: Deepfake detectado
                  value:
                    success: true
                    analysisId: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
                    fromCache: false
                    status: "completed"
                    processing: false
                    message: "Análisis completado correctamente."
                    result:
                      analysisId: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
                      timestamp: "2026-05-18T00:55:58Z"
                      mediaType: "image"
                      deepfake_score: 0.87
                      hasFace: true
                      verdict: "FAKE"
                      isDeepfake: true
                      isAuthentic: false
                      isInconclusive: false
                      isGreyZone: false
                      isSuspicious: false
                      invalidCase: null
                      riskLevel: "CRITICAL"
                      trustScore: 13
                      manipulationIndex: 87
                      interpretedLabel: "Deepfake confirmado"
                      explanation: "Esta imagen presenta un índice de manipulación del 87%, lo que indica con alta certeza que el contenido fue generado o manipulado digitalmente mediante inteligencia artificial."
                      recommendations:
                        - "No compartas este contenido bajo ninguna circunstancia sin verificarlo."
                        - "Reporta el contenido si fue recibido por canales no confiables."
                        - "Consulta con un experto en análisis forense digital."
                        - "Este material no debe usarse como evidencia o referencia."
                      analysisCategory: "deepfake"
                      recidivism:
                        isRecidivist: false
                        count: 0
                        message: null
                contenidoAutentico:
                  summary: Contenido auténtico
                  value:
                    success: true
                    analysisId: "3a1b2c88-1f2e-5c6d-8af3-2b3c4d5e6f7a"
                    fromCache: false
                    status: "completed"
                    processing: false
                    message: "Análisis completado correctamente."
                    result:
                      analysisId: "3a1b2c88-1f2e-5c6d-8af3-2b3c4d5e6f7a"
                      timestamp: "2026-05-18T01:00:00Z"
                      mediaType: "image"
                      deepfake_score: 0.12
                      hasFace: true
                      verdict: "REAL"
                      isDeepfake: false
                      isAuthentic: true
                      isInconclusive: false
                      isGreyZone: false
                      isSuspicious: false
                      invalidCase: null
                      riskLevel: "LOW"
                      trustScore: 88
                      manipulationIndex: 12
                      interpretedLabel: "Contenido auténtico"
                      explanation: "Esta imagen presenta un índice de manipulación del 12%, dentro del rango normal. El contenido aparenta ser auténtico."
                      recommendations:
                        - "El contenido parece auténtico, pero mantén buenas prácticas de verificación."
                        - "Considera la fuente original antes de compartir."
                      analysisCategory: "deepfake"
                      recidivism:
                        isRecidivist: false
                        count: 0
                        message: null
                zonaSospechosa:
                  summary: Zona SUSPICIOUS (no concluyente)
                  value:
                    success: true
                    analysisId: "5b2c3d99-2g3f-6d7e-9bg4-3c4d5e6f7g8b"
                    fromCache: false
                    status: "completed"
                    processing: false
                    message: "Análisis completado correctamente."
                    result:
                      analysisId: "5b2c3d99-2g3f-6d7e-9bg4-3c4d5e6f7g8b"
                      mediaType: "image"
                      deepfake_score: 0.55
                      hasFace: true
                      verdict: "REAL"
                      isDeepfake: false
                      isAuthentic: true
                      isInconclusive: true
                      isGreyZone: false
                      isSuspicious: true
                      riskLevel: "SUSPICIOUS"
                      trustScore: 45
                      manipulationIndex: 55
                      interpretedLabel: "Resultado sospechoso — no concluyente"
                      explanation: "Esta imagen presenta un índice de manipulación del 55%, en la zona gris entre contenido auténtico y manipulado. Puede deberse a filtros, compresión agresiva de plataformas como WhatsApp o TikTok, o ediciones menores."
                      recommendations:
                        - "El resultado no es concluyente — no confirma ni descarta manipulación."
                        - "Verifica si el contenido proviene de una fuente conocida y confiable."
                        - "Imágenes con filtros, stickers o capturadas de pantalla pueden dar este resultado."
                      analysisCategory: "uncertain"
                desdeCache:
                  summary: Resultado desde caché
                  value:
                    success: true
                    analysisId: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
                    fromCache: true
                    status: "completed"
                    message: "Resultado obtenido del caché (archivo ya analizado anteriormente)."
                    result:
                      analysisId: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
                      verdict: "FAKE"
                      isDeepfake: true
                      riskLevel: "CRITICAL"
                      trustScore: 13
                      manipulationIndex: 87
                      interpretedLabel: "Deepfake confirmado"
                      processing: false
        "400":
          description: fileUrl no proporcionada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingUrl:
                  value:
                    success: false
                    error: "fileUrl requerido"
        "401":
          description: Token JWT requerido o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Archivo no encontrado en S3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    success: false
                    error: "No se pudo acceder al archivo."
        "422":
          description: Archivo incompatible o dañado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                incompatible:
                  value:
                    success: false
                    error: "El archivo no es compatible para análisis."
        "429":
          description: Límite de análisis alcanzado (ZeroTrue rate limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rateLimit:
                  value:
                    success: false
                    error: "Límite de análisis alcanzado. Intenta en unos minutos."
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Servicio de ZeroTrue no disponible o API Key no configurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noApiKey:
                  value:
                    success: false
                    error: "Servicio de análisis no configurado."
                authError:
                  value:
                    success: false
                    error: "Error de autenticación con el servicio de análisis."

  #####################################
  ## POST /analysis/result
  #####################################
  /analysis/result:
    post:
      tags:
        - Analysis
      summary: Obtener resultado guardado por analysisId (desde MongoDB)
      description: |
        Consulta el resultado de un análisis previo usando el `analysisId`
        retornado por `/analysis/start`.

        En v2, como el análisis se completa en `/analysis/start`, este endpoint
        sirve principalmente para **recuperar resultados ya guardados** en MongoDB,
        útil si el frontend perdió la respuesta original.

      operationId: getAnalysisResult
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - referenceId
              properties:
                referenceId:
                  type: string
                  description: ID del análisis (obtenido de /analysis/start como analysisId)
                  example: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
            examples:
              request:
                value:
                  referenceId: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
      responses:
        "200":
          description: Resultado completo obtenido desde MongoDB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisCompleteResponse"
        "202":
          description: Análisis aún en proceso (estado transitorio)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisProcessingResponse"
        "400":
          description: referenceId no proporcionado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ID de análisis no encontrado en MongoDB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    success: false
                    error: "Análisis no encontrado"
        "500":
          description: Error obteniendo resultado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## GET /analysis/status/:referenceId
  #####################################
  /analysis/status/{referenceId}:
    get:
      tags:
        - Analysis
      summary: Verificar estado del análisis (lightweight)
      description: |
        Endpoint ligero para verificar si un análisis está completo.
        Consulta directamente en MongoDB — no contacta a ZeroTrue.

        Útil si el frontend quiere verificar el estado de un análisis
        iniciado en una sesión anterior.

      operationId: checkAnalysisStatus
      security:
        - BearerAuth: []
      parameters:
        - name: referenceId
          in: path
          required: true
          description: ID del análisis (analysisId de /analysis/start)
          schema:
            type: string
          example: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
      responses:
        "200":
          description: Estado obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusCheckResponse"
              examples:
                completado:
                  summary: Análisis completado
                  value:
                    success: true
                    analysisId: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
                    status: "completed"
                    isComplete: true
                    result:
                      isDeepfake: true
                      isInconclusive: false
                      isSuspicious: false
                      manipulationIndex: 87
                      riskLevel: "CRITICAL"
                      trustScore: 13
                      verdict: "FAKE"
                      interpretedLabel: "Deepfake confirmado"
                procesando:
                  summary: Aún procesando
                  value:
                    success: true
                    analysisId: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
                    status: "processing"
                    isComplete: false
                    result: null
        "400":
          description: referenceId inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error verificando estado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## POST /auth/register
  #####################################
  /auth/register:
    post:
      tags:
        - Auth
      summary: Registrar nuevo usuario
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              example:
                value:
                  name: "Juan Pérez"
                  email: "juan@example.com"
                  password: "miPassword123"
      responses:
        "201":
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Datos inválidos o email ya registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailExists:
                  value:
                    success: false
                    error: "El email ya está registrado"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## POST /auth/login
  #####################################
  /auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              example:
                value:
                  email: "juan@example.com"
                  password: "miPassword123"
      responses:
        "200":
          description: Login exitoso — retorna JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid:
                  value:
                    success: false
                    error: "Credenciales inválidas"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## GET /auth/me
  #####################################
  /auth/me:
    get:
      tags:
        - Auth
      summary: Obtener perfil del usuario autenticado
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Token requerido o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## GET /historial
  #####################################
  /historial:
    get:
      tags:
        - Historial
      summary: Obtener historial de análisis del usuario
      description: |
        Retorna el historial paginado de análisis realizados por el usuario autenticado.
        Requiere JWT válido.
      operationId: getUserHistory
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Número de página (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: Registros por página (default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
      responses:
        "200":
          description: Historial obtenido correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistorialResponse"
        "401":
          description: Token requerido o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:

    #################################
    # Auth Schemas
    #################################
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan@example.com"
        password:
          type: string
          format: password
          minLength: 6
          example: "miPassword123"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "juan@example.com"
        password:
          type: string
          format: password
          example: "miPassword123"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: JWT Bearer token — usar en cabecera Authorization
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          type: object
          properties:
            id:
              type: string
              example: "6476a2b1c3d4e5f6a7b8c9d0"
            name:
              type: string
              example: "Juan Pérez"
            email:
              type: string
              example: "juan@example.com"
            role:
              type: string
              enum: [user, admin]
              example: "user"

    UserProfile:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          type: object
          properties:
            id:
              type: string
              example: "6476a2b1c3d4e5f6a7b8c9d0"
            name:
              type: string
              example: "Juan Pérez"
            email:
              type: string
              example: "juan@example.com"
            role:
              type: string
              example: "user"

    #################################
    # Files Schemas
    #################################
    UploadUrlResponse:
      type: object
      required:
        - uploadUrl
        - fields
        - fileUrl
      properties:
        uploadUrl:
          type: string
          format: uri
          description: URL base para subir el archivo (POST multipart/form-data)
          example: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/"
        fields:
          type: object
          description: Campos que deben incluirse en el POST multipart
          properties:
            bucket:
              type: string
              example: "deepfake-detector-files"
            key:
              type: string
              example: "1779065758191_foto.jpg"
            X-Amz-Algorithm:
              type: string
              example: "AWS4-HMAC-SHA256"
            X-Amz-Credential:
              type: string
              example: "AKIAVZXYWLVGWQ5UBY5C/20260518/us-east-1/s3/aws4_request"
            X-Amz-Date:
              type: string
              example: "20260518T005558Z"
            Policy:
              type: string
              example: "eyJleHBpcmF0aW9uIjoiMjAyNi0wNS0xOFQwMTo1NTo1OFoiLC..."
            X-Amz-Signature:
              type: string
              example: "8a1cb0d182e4e335bf3ea44e90e188f806864b17..."
        fileUrl:
          type: string
          format: uri
          description: URL completa del archivo — usar en /analysis/start
          example: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/1779065758191_foto.jpg"

    #################################
    # Analysis Schemas
    #################################

    AnalysisResult:
      type: object
      description: Resultado completo del análisis deepfake con TrustAnalysisEngine v4
      properties:
        analysisId:
          type: string
          description: ID único del análisis (generado por ZeroTrue)
          example: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora del análisis
          example: "2026-05-18T00:55:58Z"
        mediaType:
          type: string
          enum: [image, video]
          description: Tipo de media analizado
          example: "image"
        deepfake_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Score crudo de deepfake (0 = real, 1 = fake)
          example: 0.87
        hasFace:
          type: boolean
          description: |
            true si se detectó un rostro humano.
            false indica contenido sin personas (animales, paisajes, arte IA).
          example: true
        verdict:
          type: string
          enum: [FAKE, REAL]
          description: Veredicto final del análisis
          example: "FAKE"
        isDeepfake:
          type: boolean
          description: true si el contenido es detectado como deepfake
          example: true
        isAuthentic:
          type: boolean
          description: true si el contenido es auténtico
          example: false
        isInconclusive:
          type: boolean
          description: true si el resultado no es concluyente (zona gris o SUSPICIOUS)
          example: false
        isGreyZone:
          type: boolean
          description: true si el score cae en la zona gris de HIGH (0.65–0.72)
          example: false
        isSuspicious:
          type: boolean
          description: |
            true si el score está en la zona SUSPICIOUS (imagen: 0.45–0.65, video: 0.45–0.60).
            Indica resultado no concluyente por posible compresión, filtros, o edición menor.
          example: false
        invalidCase:
          type: object
          nullable: true
          description: Si no null, indica por qué el análisis no fue válido
          properties:
            isInvalid:
              type: boolean
            code:
              type: string
              example: "FADR01"
            reason:
              type: string
              example: "No se detectó un rostro humano en el contenido."
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, SUSPICIOUS, HIGH, CRITICAL]
          description: |
            Nivel de riesgo clasificado por TrustAnalysisEngine v4.
            - LOW: score ≤ 0.30 (imagen) o ≤ 0.25 (video)
            - MEDIUM: score ≤ 0.45
            - SUSPICIOUS: score entre 0.45–0.65 (imagen) o 0.45–0.60 (video) — zona no concluyente
            - HIGH: score ≤ 0.80 (imagen) o ≤ 0.75 (video)
            - CRITICAL: score > 0.80 (imagen) o > 0.75 (video)
          example: "CRITICAL"
        trustScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Puntaje de confianza en autenticidad (100 = completamente auténtico, 0 = deepfake confirmado)
          example: 13
        manipulationIndex:
          type: integer
          minimum: 0
          maximum: 100
          description: Índice de manipulación en % (0 = real, 100 = deepfake)
          example: 87
        interpretedLabel:
          type: string
          description: Etiqueta interpretable para mostrar en la UI
          example: "Deepfake confirmado"
        explanation:
          type: string
          description: Explicación en lenguaje natural para usuarios no técnicos
          example: "Esta imagen presenta un índice de manipulación del 87%..."
        recommendations:
          type: array
          description: Lista de recomendaciones para el usuario
          items:
            type: string
          example:
            - "No compartas este contenido bajo ninguna circunstancia sin verificarlo."
            - "Reporta el contenido si fue recibido por canales no confiables."
        analysisCategory:
          type: string
          enum: [deepfake, ai-generated, evasion, invalid, uncertain]
          description: |
            Categoría del análisis:
            - deepfake: contenido con rostro humano manipulado
            - ai-generated: contenido sin rostro generado por IA
            - evasion: intento de evadir la detección
            - invalid: análisis no pudo completarse
            - uncertain: zona SUSPICIOUS o grey zone
          example: "deepfake"
        recidivism:
          type: object
          description: Información de reincidencia del usuario (últimos 30 días)
          properties:
            isRecidivist:
              type: boolean
              description: true si el usuario tiene 3+ análisis HIGH/CRITICAL en 30 días
              example: false
            count:
              type: integer
              description: Número de análisis HIGH/CRITICAL en los últimos 30 días
              example: 0
            message:
              type: string
              nullable: true
              example: null
        processing:
          type: boolean
          description: Siempre false en respuestas completas
          example: false

    AnalysisCompleteResponse:
      type: object
      required:
        - success
        - analysisId
        - fromCache
        - status
        - processing
        - result
      properties:
        success:
          type: boolean
          example: true
        analysisId:
          type: string
          description: ID del análisis (mismo que result.analysisId)
          example: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
        fromCache:
          type: boolean
          description: true si el resultado proviene del caché (archivo ya analizado)
          example: false
        status:
          type: string
          enum: [completed]
          example: "completed"
        processing:
          type: boolean
          example: false
        message:
          type: string
          example: "Análisis completado correctamente."
        result:
          $ref: "#/components/schemas/AnalysisResult"

    AnalysisProcessingResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        processing:
          type: boolean
          example: true
        message:
          type: string
          example: "El análisis aún está en proceso."
        result:
          type: object
          properties:
            analysisId:
              type: string
              example: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
            status:
              type: string
              enum: [processing]
              example: "processing"

    StatusCheckResponse:
      type: object
      required:
        - success
        - analysisId
        - status
        - isComplete
      properties:
        success:
          type: boolean
          example: true
        analysisId:
          type: string
          example: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
        status:
          type: string
          enum: [processing, completed]
          example: "completed"
        isComplete:
          type: boolean
          example: true
        result:
          type: object
          nullable: true
          description: Resultado resumido (solo si isComplete es true)
          properties:
            isDeepfake:
              type: boolean
              example: true
            isInconclusive:
              type: boolean
              example: false
            isSuspicious:
              type: boolean
              example: false
            manipulationIndex:
              type: integer
              example: 87
            riskLevel:
              type: string
              enum: [LOW, MEDIUM, SUSPICIOUS, HIGH, CRITICAL]
              example: "CRITICAL"
            trustScore:
              type: integer
              example: 13
            verdict:
              type: string
              enum: [FAKE, REAL]
              example: "FAKE"
            interpretedLabel:
              type: string
              example: "Deepfake confirmado"
            explanation:
              type: string
              example: "Esta imagen presenta un índice de manipulación del 87%..."

    #################################
    # Historial Schemas
    #################################
    HistorialResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        data:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                example: "6476a2b1c3d4e5f6a7b8c9d0"
              faciaReferenceId:
                type: string
                description: ID del análisis (ahora es el ID de ZeroTrue)
                example: "9f4b2c88-0e1e-4b5c-9af2-1a2b3c4d5e6f"
              isDeepfake:
                type: boolean
                example: true
              confidence:
                type: string
                description: Nivel de confianza en % (string para precisión)
                example: "87.00"
              manipulationIndex:
                type: integer
                example: 87
              riskLevel:
                type: string
                enum: [LOW, MEDIUM, SUSPICIOUS, HIGH, CRITICAL]
                example: "CRITICAL"
              trustScore:
                type: integer
                example: 13
              verdict:
                type: string
                enum: [FAKE, REAL]
                example: "FAKE"
              interpretedLabel:
                type: string
                example: "Deepfake confirmado"
              analysisCategory:
                type: string
                example: "deepfake"
              fileUrl:
                type: string
                format: uri
                example: "https://deepfake-detector-files.s3.amazonaws.com/foto.jpg"
              createdAt:
                type: string
                format: date-time
                example: "2026-05-18T00:55:58Z"

    #################################
    # Error Schema
    #################################
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Mensaje de error legible para el usuario
          example: "No se pudo procesar la solicitud"
        details:
          type: string
          nullable: true
          description: Detalles técnicos (solo en modo desarrollo)
          example: "S3 Access Denied: Invalid credentials"
        code:
          type: string
          nullable: true
          description: Código de error interno
          example: "ERR_S3_ACCESS_DENIED"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT obtenido en /auth/login. Enviar como: Authorization: Bearer <token>"