openapi: 3.1.0
info:
  title: Deepfake Detection API
  version: 1.0.0
  description: |
    API para detección de deepfakes en imágenes y videos usando Facia AI.
    
    ## Flujo de uso
    
    1. **Solicitar URL de subida** - `POST /api/files/upload-url`
    2. **Subir archivo a S3** - Usar la URL presignada desde el frontend
    3. **Iniciar análisis** - `POST /api/analysis/start`
    4. **Consultar resultado** - `POST /api/analysis/result`
    5. **Verificar estado** (opcional) - `GET /api/analysis/status/:id`
    
    ## Tipos de archivo soportados
    
    - **Imágenes:** PNG, JPG, JPEG (máx 50MB)
    - **Videos:** MP4, MOV, WEBM (máx 500MB)
    
    ## Tiempos de procesamiento
    
    - Imágenes: 2-10 segundos
    - Videos: 5-30 segundos

  contact:
    name: API Support
    email: support@tudominio.com
  license:
    name: MIT

servers:
  - url: https://backend-0ecl.onrender.com
    description: Producción
  - url: http://localhost:4000
    description: Desarrollo Local

tags:
  - name: Files
    description: Gestión de archivos y subida a S3
  - name: Analysis
    description: Análisis de deepfake con Facia AI
  - name: Auth
    description: Autenticación y gestión de usuarios
  - name: Historial
    description: Historial de análisis del usuario
  - name: Facia (Proxy)
    description: Proxy autenticado hacia la API de Facia AI

paths:

  #####################################
  ## POST /upload-url
  #####################################
  /upload/upload-url:
    post:
      tags:
        - Files
      summary: Generar URL presignada para subir archivo
      description: |
        Genera credenciales temporales para subir un archivo directamente a S3 
        desde el frontend, sin pasar por el servidor backend.
        
        **Seguridad:**
        - URL válida por 1 hora
        - Tamaño máximo: 5GB
        - Solo archivos de imagen o video
        
        **Siguiente paso:**
        Usar `uploadUrl` y `fields` para hacer un POST multipart desde el frontend.

      operationId: generateUploadUrl
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  description: Nombre original del archivo
                  example: "video-sospechoso.mp4"
                  minLength: 1
                  maxLength: 255
                fileType:
                  type: string
                  description: MIME type del archivo
                  example: "video/mp4"
                  enum:
                    - image/jpeg
                    - image/jpg
                    - image/png
                    - video/mp4
                    - video/quicktime
                    - video/webm
              required:
                - fileName
                - fileType
            examples:
              video:
                value:
                  fileName: "video-prueba.mp4"
                  fileType: "video/mp4"
              image:
                value:
                  fileName: "foto-perfil.jpg"
                  fileType: "image/jpeg"

      responses:
        "200":
          description: URL presignada generada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
              examples:
                success:
                  value:
                    uploadUrl: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/"
                    fields:
                      bucket: "deepfake-detector-files"
                      key: "1763532656440_video-prueba.mp4"
                      X-Amz-Algorithm: "AWS4-HMAC-SHA256"
                      X-Amz-Credential: "AKIAVZXYWLVGWQ5UBY5C/20251119/us-east-1/s3/aws4_request"
                      X-Amz-Date: "20251119T040145Z"
                      Policy: "eyJleHBpcmF0aW9uIjoi..."
                      X-Amz-Signature: "d1e5219137f9969c..."
                    fileUrl: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/1763532656440_video-prueba.mp4"

        "400":
          description: Parámetros inválidos o faltantes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingParams:
                  value:
                    success: false
                    error: "fileName y fileType son requeridos"
                invalidType:
                  value:
                    success: false
                    error: "Tipo de archivo no soportado. Use imagen (png, jpg) o video (mp4, webm)"

        "500":
          description: Error del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## POST /analysis/start
  #####################################
  /analysis/start:
    post:
      tags:
        - Analysis
      summary: Iniciar análisis de deepfake
      description: |
        Inicia el análisis de un archivo que ya fue subido a S3.
        
        **Proceso:**
        1. Descarga el archivo de S3
        2. Lo envía a Facia AI para análisis
        3. Retorna un ID de referencia para consultar el resultado
        
        **Tiempo estimado:**
        - Imágenes: 2-10 segundos
        - Videos: 5-30 segundos
        
        **Siguiente paso:**
        Usar el `referenceId` retornado para consultar el resultado en `/api/analysis/result`

      operationId: startAnalysis
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileUrl:
                  type: string
                  format: uri
                  description: URL completa del archivo en S3 (obtenida de /api/files/upload-url)
                  example: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/1763532656440_video.mp4"
              required:
                - fileUrl
            examples:
              video:
                value:
                  fileUrl: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/1763532656440_video.mp4"

      responses:
        "200":
          description: Análisis iniciado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisStartResponse"
              examples:
                success:
                  value:
                    success: true
                    referenceId: "29D027498EE8EBB"
                    message: "Archivo enviado a análisis correctamente. El procesamiento puede tomar unos segundos."
                    estimatedTime: "5-30 segundos"
                    status: "processing"

        "400":
          description: URL del archivo no proporcionada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Archivo no encontrado en S3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    success: false
                    error: "No se pudo acceder al archivo. Verifica que se haya subido correctamente."

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "503":
          description: Servicio de Facia no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serviceUnavailable:
                  value:
                    success: false
                    error: "No se pudo enviar el archivo a análisis. Por favor, intenta de nuevo."

  #####################################
  ## POST /analysis/result
  #####################################
  /analysis/result:
    post:
      tags:
        - Analysis
      summary: Obtener resultado del análisis
      description: |
        Consulta el resultado del análisis usando el ID obtenido en `/api/analysis/start`.
        
        **Comportamiento con reintentos automáticos:**
        - Reintenta hasta 10 veces si el resultado no está listo
        - Espera 3 segundos entre cada intento
        - Tiempo máximo de espera: ~30 segundos
        
        **Estados del resultado:**
        - `status: 0` → **Deepfake detectado** (contenido falso)
        - `status: 1` → **Contenido auténtico** (no es deepfake)
        - `status: null` → Aún procesando
        
        **Confianza del resultado:**
        - `0-30%` → Muy probablemente auténtico
        - `30-70%` → Zona gris (revisar manualmente)
        - `70-100%` → Muy probablemente deepfake

      operationId: getAnalysisResult
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                referenceId:
                  type: string
                  description: ID del análisis (obtenido de /analysis/start)
                  example: "29D027498EE8EBB"
              required:
                - referenceId
            examples:
              request:
                value:
                  referenceId: "29D027498EE8EBB"

      responses:
        "200":
          description: Resultado completo obtenido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResultComplete"
              examples:
                deepfakeDetected:
                  summary: Deepfake detectado
                  value:
                    success: true
                    processing: false
                    result:
                      referenceId: "29D027498EE8EBB"
                      type: "deepfake"
                      status: 0
                      isDeepfake: true
                      isAuthentic: false
                      confidence: "87.32"
                      verdict: "FAKE"
                      deepfake_score: 0.8732
                      decline_code: "FADR07"
                      decline_reason: "Evasion attack detected."
                      declined_proof: "https://api.facia.ai/api/image-url/691d5beca320adf85120e159"
                      timestamp: "2025-11-19T04:01:45Z"

                authenticContent:
                  summary: Contenido auténtico
                  value:
                    success: true
                    processing: false
                    result:
                      referenceId: "A9B123XYZ456"
                      type: "deepfake"
                      status: 1
                      isDeepfake: false
                      isAuthentic: true
                      confidence: "12.45"
                      verdict: "REAL"
                      deepfake_score: 0.1245
                      decline_code: null
                      decline_reason: null
                      declined_proof: null
                      timestamp: "2025-11-19T04:02:30Z"

        "202":
          description: Análisis aún en proceso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResultProcessing"
              examples:
                processing:
                  value:
                    success: true
                    processing: true
                    message: "El análisis aún está en proceso. Por favor, vuelve a consultar en unos segundos."
                    result:
                      referenceId: "29D027498EE8EBB"
                      status: "processing"

        "400":
          description: ID de análisis no proporcionado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: ID de análisis no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    success: false
                    error: "No se pudo obtener el resultado. El ID de análisis puede ser inválido."

        "408":
          description: Timeout - Procesamiento demorado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                timeout:
                  value:
                    success: false
                    error: "El análisis está tomando más tiempo del esperado. Por favor, intenta de nuevo en unos momentos."

        "500":
          description: Error obteniendo resultado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## GET /analysis/status/:referenceId
  #####################################
  /analysis/status/{referenceId}:
    get:
      tags:
        - Analysis
      summary: Verificar estado del análisis (lightweight)
      description: |
        Endpoint ligero para verificar rápidamente si el análisis está completo.
        
        **Ideal para polling desde el frontend:**
        ```javascript
        // Ejemplo de polling cada 2 segundos
        const checkStatus = async (referenceId) => {
          const response = await fetch(`/api/analysis/status/${referenceId}`);
          const data = await response.json();
        
          if (data.isComplete) {
            // Obtener resultado completo
            getFullResult(referenceId);
          } else {
            // Esperar 2s y reintentar
            setTimeout(() => checkStatus(referenceId), 2000);
          }
        };
        ```
        
        **Características:**
        - Sin reintentos automáticos (responde inmediatamente)
        - Payload mínimo (solo estado básico)
        - Baja latencia (~50-100ms)

      operationId: checkAnalysisStatus
      security:
        - BearerAuth: []
      parameters:
        - name: referenceId
          in: path
          required: true
          description: ID del análisis
          schema:
            type: string
          example: "29D027498EE8EBB"

      responses:
        "200":
          description: Estado obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusCheckResponse"
              examples:
                completed:
                  summary: Análisis completado
                  value:
                    success: true
                    referenceId: "29D027498EE8EBB"
                    status: "completed"
                    isComplete: true
                    result:
                      isDeepfake: true
                      confidence: "87.32"
                      verdict: "FAKE"

                processing:
                  summary: Aún procesando
                  value:
                    success: true
                    referenceId: "29D027498EE8EBB"
                    status: "processing"
                    isComplete: false
                    result: null

        "400":
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: ID no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Error verificando estado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## POST /auth/register
  #####################################
  /auth/register:
    post:
      tags:
        - Auth
      summary: Registrar nuevo usuario
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              example:
                value:
                  name: "Juan Pérez"
                  email: "juan@example.com"
                  password: "miPassword123"
      responses:
        "201":
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Datos inválidos o email ya registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailExists:
                  value:
                    success: false
                    error: "El email ya está registrado"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## POST /auth/login
  #####################################
  /auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              example:
                value:
                  email: "juan@example.com"
                  password: "miPassword123"
      responses:
        "200":
          description: Login exitoso — retorna JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid:
                  value:
                    success: false
                    error: "Credenciales inválidas"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## GET /auth/me
  #####################################
  /auth/me:
    get:
      tags:
        - Auth
      summary: Obtener perfil del usuario autenticado
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Token requerido o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## POST /auth/token
  #####################################
  /auth/token:
    post:
      tags:
        - Auth
      summary: Obtener token de Facia AI (proxy autenticado)
      description: |
        Proxy autenticado para obtener un token de acceso de Facia AI.
        Requiere JWT válido del usuario. Las credenciales de Facia se pasan en el body.
      operationId: getFaciaToken
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: Client ID de Facia AI
                client_secret:
                  type: string
                  description: Client Secret de Facia AI
      responses:
        "200":
          description: Token de Facia AI obtenido
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  access_token:
                    type: string
        "401":
          description: Token JWT requerido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error al contactar Facia AI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## GET /historial
  #####################################
  /historial:
    get:
      tags:
        - Historial
      summary: Obtener historial de análisis del usuario
      description: |
        Retorna el historial paginado de análisis realizados por el usuario autenticado.
        Requiere JWT válido.
      operationId: getUserHistory
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Número de página (default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          description: Registros por página (default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
      responses:
        "200":
          description: Historial obtenido correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistorialResponse"
        "401":
          description: Token requerido o inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## POST /facia/liveness
  #####################################
  /facia/liveness:
    post:
      tags:
        - Facia (Proxy)
      summary: Crear transacción de liveness en Facia AI
      description: |
        Proxy autenticado que reenvía la solicitud de liveness a Facia AI.
        Requiere un token de Facia AI activo (obtenido en `/auth/token`).
      operationId: createLiveness
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileUrl
                - token
              properties:
                fileUrl:
                  type: string
                  format: uri
                  description: URL del archivo en S3
                  example: "https://deepfake-detector-files.s3.amazonaws.com/video.mp4"
                token:
                  type: string
                  description: Token de acceso de Facia AI
                  example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: Transacción creada en Facia AI
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference_id:
                    type: string
                    example: "29D027498EE8EBB"
        "400":
          description: Error al crear transacción
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token JWT requerido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  #####################################
  ## POST /facia/result
  #####################################
  /facia/result:
    post:
      tags:
        - Facia (Proxy)
      summary: Obtener resultado de liveness de Facia AI
      description: Proxy autenticado para consultar el resultado de una transacción de liveness.
      operationId: getLivenessResult
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reference_id
                - token
              properties:
                reference_id:
                  type: string
                  example: "29D027498EE8EBB"
                token:
                  type: string
                  example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: Resultado de Facia AI
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Error al obtener resultado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token JWT requerido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:

    #################################
    # Auth Schemas
    #################################
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan@example.com"
        password:
          type: string
          format: password
          minLength: 6
          example: "miPassword123"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "juan@example.com"
        password:
          type: string
          format: password
          example: "miPassword123"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: JWT Bearer token — usar en cabecera Authorization
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          type: object
          properties:
            id:
              type: string
              example: "6476a2b1c3d4e5f6a7b8c9d0"
            name:
              type: string
              example: "Juan Pérez"
            email:
              type: string
              example: "juan@example.com"
            role:
              type: string
              enum: [user, admin]
              example: "user"

    UserProfile:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          type: object
          properties:
            id:
              type: string
              example: "6476a2b1c3d4e5f6a7b8c9d0"
            name:
              type: string
              example: "Juan Pérez"
            email:
              type: string
              example: "juan@example.com"
            role:
              type: string
              example: "user"

    #################################
    # Historial Schemas
    #################################
    HistorialResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        data:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                example: "6476a2b1c3d4e5f6a7b8c9d0"
              referenceId:
                type: string
                example: "29D027498EE8EBB"
              isDeepfake:
                type: boolean
                example: true
              confidence:
                type: string
                example: "87.32"
              verdict:
                type: string
                enum: [FAKE, REAL]
                example: "FAKE"
              fileUrl:
                type: string
                format: uri
                example: "https://deepfake-detector-files.s3.amazonaws.com/video.mp4"
              createdAt:
                type: string
                format: date-time
                example: "2025-11-19T04:01:45Z"

    #################################
    # Files Schemas
    #################################

    UploadUrlResponse:
      type: object
      required:
        - uploadUrl
        - fields
        - fileUrl
      properties:
        uploadUrl:
          type: string
          format: uri
          description: URL base para subir el archivo (POST multipart)
          example: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/"
        fields:
          type: object
          description: Campos que deben incluirse en el POST multipart
          required:
            - bucket
            - key
            - X-Amz-Algorithm
            - X-Amz-Credential
            - X-Amz-Date
            - Policy
            - X-Amz-Signature
          properties:
            bucket:
              type: string
              example: "deepfake-detector-files"
            key:
              type: string
              example: "1763532656440_video.mp4"
            X-Amz-Algorithm:
              type: string
              example: "AWS4-HMAC-SHA256"
            X-Amz-Credential:
              type: string
              example: "AKIAVZXYWLVGWQ5UBY5C/20251119/us-east-1/s3/aws4_request"
            X-Amz-Date:
              type: string
              example: "20251119T040145Z"
            Policy:
              type: string
              example: "eyJleHBpcmF0aW9uIjoiMjAyNS0xMS0xOVQwMToz..."
            X-Amz-Signature:
              type: string
              example: "d1e5219137f9969c5c869c1286ed25b7813fcdd8..."
        fileUrl:
          type: string
          format: uri
          description: URL completa del archivo una vez subido (usar en /api/analysis/start)
          example: "https://deepfake-detector-files.s3.us-east-1.amazonaws.com/1763532656440_video.mp4"

    #################################
    # Analysis Schemas
    #################################
    AnalysisStartResponse:
      type: object
      required:
        - success
        - referenceId
        - message
        - status
      properties:
        success:
          type: boolean
          example: true
        referenceId:
          type: string
          description: ID único del análisis (guardar para consultar resultado)
          example: "29D027498EE8EBB"
        message:
          type: string
          example: "Archivo enviado a análisis correctamente. El procesamiento puede tomar unos segundos."
        estimatedTime:
          type: string
          description: Tiempo estimado de procesamiento
          example: "5-30 segundos"
        status:
          type: string
          enum:
            - processing
          example: "processing"

    AnalysisResultComplete:
      type: object
      required:
        - success
        - processing
        - result
      properties:
        success:
          type: boolean
          example: true
        processing:
          type: boolean
          example: false
        result:
          type: object
          required:
            - referenceId
            - status
            - isDeepfake
            - isAuthentic
          properties:
            referenceId:
              type: string
              description: ID del análisis
              example: "29D027498EE8EBB"
            type:
              type: string
              example: "deepfake"
            status:
              type: integer
              description: "0 = deepfake detectado, 1 = contenido auténtico"
              enum: [0, 1]
              example: 0
            isDeepfake:
              type: boolean
              description: true si es deepfake
              example: true
            isAuthentic:
              type: boolean
              description: true si es auténtico
              example: false
            verdict:
              type: string
              description: Veredicto simple
              enum:
                - FAKE
                - REAL
              example: "FAKE"
            confidence:
              type: string
              description: Nivel de confianza en porcentaje (string para precisión)
              example: "87.32"
            deepfake_score:
              type: number
              format: float
              description: Score original de Facia (0-1)
              minimum: 0
              maximum: 1
              example: 0.8732
            decline_code:
              type: string
              nullable: true
              description: Código de rechazo (solo si es deepfake)
              example: "FADR07"
            decline_reason:
              type: string
              nullable: true
              description: Motivo del rechazo legible
              example: "Evasion attack detected."
            declined_proof:
              type: string
              format: uri
              nullable: true
              description: URL de imagen de prueba (expira en 24h)
              example: "https://api.facia.ai/api/image-url/691d5beca320adf85120e159"
            timestamp:
              type: string
              format: date-time
              description: Fecha y hora del análisis
              example: "2025-11-19T04:01:45Z"

    AnalysisResultProcessing:
      type: object
      required:
        - success
        - processing
        - message
        - result
      properties:
        success:
          type: boolean
          example: true
        processing:
          type: boolean
          example: true
        message:
          type: string
          example: "El análisis aún está en proceso. Por favor, vuelve a consultar en unos segundos."
        result:
          type: object
          required:
            - referenceId
            - status
          properties:
            referenceId:
              type: string
              example: "29D027498EE8EBB"
            status:
              type: string
              enum:
                - processing
              example: "processing"

    StatusCheckResponse:
      type: object
      required:
        - success
        - referenceId
        - status
        - isComplete
      properties:
        success:
          type: boolean
          example: true
        referenceId:
          type: string
          example: "29D027498EE8EBB"
        status:
          type: string
          enum:
            - processing
            - completed
          example: "completed"
        isComplete:
          type: boolean
          description: true si el análisis está completo
          example: true
        result:
          type: object
          nullable: true
          description: Resultado resumido (solo si está completo)
          properties:
            isDeepfake:
              type: boolean
              example: true
            confidence:
              type: string
              example: "87.32"
            verdict:
              type: string
              enum:
                - FAKE
                - REAL
              example: "FAKE"

    #################################
    # Error Schema
    #################################
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Mensaje de error legible
          example: "No se pudo procesar la solicitud"
        details:
          type: string
          nullable: true
          description: Detalles técnicos (solo en desarrollo)
          example: "S3 Access Denied: Invalid credentials"
        code:
          type: string
          nullable: true
          description: Código de error interno
          example: "ERR_S3_ACCESS_DENIED"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT obtenido en /auth/login. Enviar como: Authorization: Bearer <token>"
